name: E2E Windows (MockGame + RST, screenshots and latency)

on:
  push:
    branches:
      - 'claude/**'
      - 'goal*'
      - 'fix-*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'RST.csproj'
      - '.github/workflows/e2e-windows.yml'
  workflow_dispatch:
    inputs:
      ocr:
        description: 'OCR method (OneOCR or Windows OCR)'
        default: 'OneOCR'

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OCR: ${{ github.event.inputs.ocr || 'OneOCR' }}
      # Config that turns this fork's overlay features off, for before/after screenshots
      STYLE_OFF: 'font_size_from_line_height=false;text_style_from_game=false;game_fonts=;word_colors=false;auto_match_font=false'
      # RST saves its config, so the run after must turn them on explicitly
      STYLE_ON: 'font_size_from_line_height=true;text_style_from_game=true;game_fonts=;word_colors=true;auto_match_font=true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build RST
        run: dotnet build RST.csproj -c Release -p:CsWinRTGenerateProjection=false -p:CsWinRTIIDOptimizerOptOut=true

      - name: Lay out OneOCR next to rst.exe (as MakeReleaseZip.bat does)
        shell: bash
        run: cp app/OneOcr/* app/

      - name: Build MockGame
        run: dotnet build tests/MockGame/MockGame.csproj -c Release -o mockbin

      - name: Unit tests
        if: hashFiles('tests/RST.Tests/RST.Tests.csproj') != ''
        run: dotnet test tests/RST.Tests/RST.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Upload the build (for testing on a real game)
        uses: actions/upload-artifact@v4
        with:
          name: rst-build
          path: |
            app/
            !app/Cache/**
            !app/config.txt
            tests/e2e/latency_report.py
            tests/e2e/README_vi.md
          retention-days: 30

      - name: Install screenshot tools
        run: pip install mss pillow

      - name: Run cache scenario (2 sessions = restart in between)
        shell: bash
        run: |
          OUT="evidence/cache"
          python tests/e2e/run_e2e.py --rst app/rst.exe --mock mockbin/MockGame.exe \
            --script tests/e2e/scenarios/cache.txt --out "$OUT" --sessions 2 --fresh \
            --label "${GITHUB_REF_NAME} cache scenario" --env RST_FORCE_OCR_SCALE=0.75 \
            --config "source_language=en;target_language=vi;ocr_method=${OCR};translation_service=Google Translate"

      - name: Run style scenario (new overlay features off = upstream behaviour)
        shell: bash
        run: |
          python tests/e2e/run_e2e.py --rst app/rst.exe --mock mockbin/MockGame.exe \
            --script tests/e2e/scenarios/style.txt --out evidence/style_before --sessions 1 \
            --label "${GITHUB_REF_NAME} style scenario, features off" --shot-delay 4500 \
            --config "source_language=en;target_language=vi;ocr_method=${OCR};translation_service=Google Translate;${STYLE_OFF}"

      - name: Run style scenario
        shell: bash
        run: |
          python tests/e2e/run_e2e.py --rst app/rst.exe --mock mockbin/MockGame.exe \
            --script tests/e2e/scenarios/style.txt --out evidence/style --sessions 1 --dump-styles \
            --label "${GITHUB_REF_NAME} style scenario" --shot-delay 4500 \
            --config "source_language=en;target_language=vi;ocr_method=${OCR};translation_service=Google Translate;${STYLE_ON}"

      - name: Run Wuthering Waves-like scenario (RST finds the game by itself)
        shell: bash
        run: |
          python tests/e2e/run_e2e.py --rst app/rst.exe --mock mockbin/MockGame.exe \
            --script tests/e2e/scenarios/wuwa.txt --out evidence/wuwa --sessions 1 --dump-styles \
            --label "${GITHUB_REF_NAME} Wuthering Waves-like scenario" --shot-delay 3500 \
            --window @known --mock-as Client-Win64-Shipping.exe --press-key-ms 120 \
            --mock-arg=--layout --mock-arg=wuwa --mock-arg=--title --mock-arg="Wuthering Waves" \
            --config "source_language=en;target_language=vi;ocr_method=${OCR};translation_service=Google Translate;${STYLE_ON}"
          python - <<'EOF'
          import csv, sys
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          rows = [r for r in csv.reader(open('evidence/wuwa/s1_rst_metrics.csv', encoding='utf-8')) if len(r) > 2]
          found = [r[2] for r in rows if r[1] == 'known_game']
          modes = [r[2] for r in rows if r[1] == 'game_mode']
          stray = sorted({r[2].split('|')[3] for r in rows if r[1] == 'font_size' and 'UID' in r[2]})
          shown = {}
          for r in rows:
              if r[1] == 'font_size':
                  p = r[2].split('|')
                  shown[p[3]] = p[4]
          pairs = "".join(f"- {k} => {v}\n" for k, v in shown.items())
          report = f"known_game: {found[:1]}\ngame_mode: {modes[:1]}\nUID translated (must be none): {stray}\n\nTranslations:\n{pairs}"
          kept = all(t in v for k, v in shown.items() for t in ('Resonators', 'Rover', 'Echo') if t in k)
          report += f"\nGame terms kept in translations: {kept}\n"
          # The Terminal menu: translated from the game's dictionary, numbers left alone, labels fitting
          events = [r for r in csv.reader(open('evidence/wuwa/s1_mock_events.csv', encoding='utf-8')) if len(r) > 5][1:]
          menu = [i for i, r in enumerate(events) if r[3] == 'wuwa_menu']
          if menu:
              t0 = int(events[menu[0]][0])
              t1 = int(events[menu[0] + 1][0]) if menu[0] + 1 < len(events) else t0 + 9000
              window = [r for r in rows if t0 <= int(r[0]) < t1]
              requests = sum(1 for r in window if r[1] == '3. Translation request')
              labels = {}
              for r in window:
                  if r[1] == 'font_size':
                      p = r[2].split('|')
                      labels[p[3]] = (p[4], float(p[0]), float(p[1]), p[11] if len(p) > 11 else '?')
              numbers = [k for k in labels if not any(c.isalpha() for c in k)]
              report += f"\nTerminal menu: {len(labels)} overlays, translation requests: {requests}, numbers overlaid (must be none): {numbers}\n"
              report += "".join(f"- {k} => {v[0]}  ({v[1]:.0f}px / game {v[2]:.0f}px, {v[3]})\n" for k, v in labels.items())
          open('evidence/wuwa/wuwa_check.md', 'w', encoding='utf-8').write(report)
          print(report)
          EOF

      - name: Install Ollama and a small model (AI translation for coloured-word tags)
        id: ollama
        continue-on-error: true
        timeout-minutes: 15
        shell: powershell
        run: |
          # The portable zip, not the installer: the installer starts the Ollama tray app, and
          # Start-Process -Wait then waits for it forever
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip -OutFile "$env:RUNNER_TEMP\ollama.zip"
          Expand-Archive "$env:RUNNER_TEMP\ollama.zip" -DestinationPath "$env:RUNNER_TEMP\ollama"
          $ollama = "$env:RUNNER_TEMP\ollama\ollama.exe"
          Start-Process $ollama -ArgumentList 'serve' -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\ollama-serve.log" -RedirectStandardError "$env:RUNNER_TEMP\ollama-serve.err"
          Start-Sleep -Seconds 8
          & $ollama pull qwen2.5:3b
          & $ollama list
          # Warm up so the first translation is not slowed by loading the model
          & $ollama run qwen2.5:3b "Say OK" | Out-Host

      - name: Run coloured-words scenario with the AI translator
        if: steps.ollama.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          # Processes started in an earlier step are gone: start the server here, for this run
          "$RUNNER_TEMP/ollama/ollama.exe" serve > "$RUNNER_TEMP/ollama-serve2.log" 2>&1 &
          for i in $(seq 1 30); do curl -s http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          curl -s http://localhost:11434/api/generate -d '{"model":"qwen2.5:3b","prompt":"OK","stream":false}' > /dev/null
          # --fresh: the earlier Google runs cached these lines; the AI must translate them itself
          python tests/e2e/run_e2e.py --rst app/rst.exe --mock mockbin/MockGame.exe --fresh \
            --script tests/e2e/scenarios/words_llm.txt --out evidence/words_llm --sessions 1 \
            --label "${GITHUB_REF_NAME} coloured words, Ollama qwen2.5:3b" --shot-delay 17000 --timeout 900 \
            --config "source_language=en;target_language=vi;ocr_method=${OCR};translation_service=Ollama;ollama_model=qwen2.5:3b;${STYLE_ON}"

      - name: Publish evidence to ci-evidence branch
        if: always()
        shell: bash
        run: |
          set -e
          DEST="${GITHUB_REF_NAME//\//_}/run${GITHUB_RUN_NUMBER}"
          mkdir -p "$RUNNER_TEMP/ev" && cp -r evidence/. "$RUNNER_TEMP/ev/" || true
          cp app/Cache/* "$RUNNER_TEMP/ev/" 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin ci-evidence && git checkout -f -B ci-evidence origin/ci-evidence
            git clean -fdq
            mkdir -p "$DEST" && cp -r "$RUNNER_TEMP/ev/." "$DEST/"
            echo "${GITHUB_SHA}" > "$DEST/commit.txt"
            git add "$DEST" && git commit -qm "Evidence ${DEST} (${GITHUB_SHA::7})" || true
            if git push origin ci-evidence; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
